name: Deploy
# Deploys the Worker after tests pass on main. Skips (green) until Cloudflare is set up: needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a real D1 database_id in wrangler.jsonc (docs/DEPLOY.md).
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "Cloudflare not set up yet (docs/DEPLOY.md); skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.ready.outputs.go == 'true'
        run: npm ci && node tools/build.mjs
      - if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply store --remote
          npx wrangler deploy
